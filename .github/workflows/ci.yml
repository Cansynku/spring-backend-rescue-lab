name: Backend CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify H2 regression suite
        run: mvn --batch-mode --no-transfer-progress clean verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify demo browser logic without external dependencies
        run: node --test scripts/test-demo-ui.cjs
  verify-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: backend_rescue_test
          POSTGRES_USER: backend_rescue
          POSTGRES_PASSWORD: backend_rescue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backend_rescue -d backend_rescue_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify against isolated PostgreSQL database
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dspring.datasource.url=jdbc:postgresql://127.0.0.1:5432/backend_rescue_test
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dspring.datasource.username=backend_rescue
          -Dspring.datasource.password=backend_rescue
          clean verify
