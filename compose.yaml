name: backend-rescue-payments
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: backend_rescue_payments
      POSTGRES_USER: backend_rescue
      POSTGRES_PASSWORD: backend_rescue
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - backend_rescue_payments_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend_rescue -d backend_rescue_payments"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  backend_rescue_payments_pg:
