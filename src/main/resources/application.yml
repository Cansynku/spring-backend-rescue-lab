server:
  address: 127.0.0.1
  port: ${PORT:8080}
spring:
  application:
    name: spring-backend-rescue-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/backend_rescue}
    username: ${DB_USERNAME:backend_rescue}
    password: ${DB_PASSWORD:backend_rescue}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # BR-009: intentionally no schema migration history.
payment-provider:
  base-url: ${PAYMENT_PROVIDER_BASE_URL:http://127.0.0.1:8080/sandbox-provider}
