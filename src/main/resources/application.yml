server:
  address: 127.0.0.1
  port: ${PORT:8080}
spring:
  application:
    name: spring-backend-rescue-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/backend_rescue_payments}
    username: ${DB_USERNAME:backend_rescue}
    password: ${DB_PASSWORD:backend_rescue}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration/{vendor}
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
payment-provider:
  base-url: ${PAYMENT_PROVIDER_BASE_URL:http://127.0.0.1:8080/sandbox-provider}
  connect-timeout-ms: ${PAYMENT_PROVIDER_CONNECT_TIMEOUT_MS:1000}
  read-timeout-ms: ${PAYMENT_PROVIDER_READ_TIMEOUT_MS:2000}
